name: Follow upstream releases

on:
  schedule:
    # Every day at 01:30 UTC, before the builder's own sync at 02:23 UTC: the
    # builder documents the release it finds, so it has to see the branch this
    # workflow publishes, not yesterday's. Running after it left a whole day
    # where the device lists advertised a patch set the builder refused.
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to follow instead of the newest one
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: follow-upstream
  cancel-in-progress: false

jobs:
  follow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout device backports
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve the newest upstream release
        id: upstream
        env:
          UPSTREAM_REPOSITORY: fanchmwrt/fanchmwrt
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          ref="${REQUESTED_REF}"
          if [[ -z "$ref" ]]; then
            tags="$(git ls-remote --tags --refs "https://github.com/${UPSTREAM_REPOSITORY}.git" \
              | awk '{print $2}' | sed 's|^refs/tags/||' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V || true)"
            ref="$(printf '%s\n' "$tags" | tail -1)"
          fi
          if [[ -z "$ref" ]]; then
            echo "::error::No release tag found for ${UPSTREAM_REPOSITORY}"
            exit 1
          fi
          commit="$(git ls-remote "https://github.com/${UPSTREAM_REPOSITORY}.git" "refs/tags/${ref}^{}" | cut -f1)"
          if [[ -z "$commit" ]]; then
            commit="$(git ls-remote "https://github.com/${UPSTREAM_REPOSITORY}.git" "refs/tags/${ref}" | cut -f1)"
          fi
          if [[ -z "$commit" ]]; then
            echo "::error::Cannot resolve the commit behind ${ref}"
            exit 1
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "Newest upstream release: ${ref} (${commit})"

      - name: Check whether the branch already follows the release
        id: state
        env:
          REF: ${{ steps.upstream.outputs.ref }}
          COMMIT: ${{ steps.upstream.outputs.commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin "refs/heads/${REF}" >/dev/null 2>&1; then
            echo "exists=0" >> "$GITHUB_OUTPUT"
            echo "follows=0" >> "$GITHUB_OUTPUT"
            echo "Branch ${REF} does not exist yet."
            exit 0
          fi
          git fetch --quiet origin "refs/heads/${REF}:refs/remotes/origin/${REF}"
          base="$(git show "origin/${REF}:manifest.json" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["fanchmwrt"]["base_commit"])')"
          echo "exists=1" >> "$GITHUB_OUTPUT"
          # The fallback ref has to follow too. Recommending a release whose
          # branch is current while the default branch still names an older base
          # is exactly the state that made the builder's fallback path fail.
          default_follows=0
          if git fetch --quiet origin "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}" 2>/dev/null; then
            default_base="$(git show "origin/${DEFAULT_BRANCH}:manifest.json" 2>/dev/null \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["fanchmwrt"]["base_commit"])' 2>/dev/null || echo "")"
            if [[ "$default_base" == "$COMMIT" ]]; then
              default_follows=1
            fi
          fi
          echo "default_follows=${default_follows}" >> "$GITHUB_OUTPUT"
          if [[ "$base" == "$COMMIT" && "$default_follows" == "1" ]]; then
            echo "follows=1" >> "$GITHUB_OUTPUT"
            echo "Branch ${REF} and ${DEFAULT_BRANCH} already target ${COMMIT}."
          elif [[ "$base" == "$COMMIT" ]]; then
            echo "follows=0" >> "$GITHUB_OUTPUT"
            echo "Branch ${REF} targets ${COMMIT} but ${DEFAULT_BRANCH} does not; refreshing the fallback."
          else
            echo "follows=0" >> "$GITHUB_OUTPUT"
            echo "Branch ${REF} targets ${base}, expected ${COMMIT}."
          fi

      - name: Checkout upstream release
        if: steps.state.outputs.follows != '1'
        uses: actions/checkout@v5
        with:
          repository: fanchmwrt/fanchmwrt
          ref: ${{ steps.upstream.outputs.ref }}
          path: upstream
          fetch-depth: 1

      - name: Checkout the builder for its source customization
        if: steps.state.outputs.follows != '1'
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.BUILDER_REPOSITORY || 'nd002723/fanchmwrt-builder' }}
          path: builder
          fetch-depth: 1

      - name: Try the current patch set on the new release
        id: trial
        if: steps.state.outputs.follows != '1'
        run: |
          set -uo pipefail
          if ! bash builder/scripts/prepare-source.sh upstream; then
            echo "ok=0" >> "$GITHUB_OUTPUT"
            echo "reason=prepare" >> "$GITHUB_OUTPUT"
            echo "::warning::prepare-source.sh failed on ${{ steps.upstream.outputs.ref }}"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/repaired"
          failed=""
          repaired=""
          # Accept the same bounded fuzz scripts/apply.sh accepts. The trial used
          # to demand an exact match while the builder tolerated one to three
          # drifted context lines, so a patch the builder would apply could fail
          # the trial and block a release that was actually fine.
          for patch in patches/*.patch; do
            name="$(basename "$patch")"
            if git -C upstream apply --check --whitespace=nowarn "${PWD}/${patch}" 2>/dev/null; then
              git -C upstream apply --whitespace=nowarn "${PWD}/${patch}"
              continue
            fi
            loosened=0
            for fuzz in 1 2 3; do
              if ( cd upstream && patch -p1 --fuzz="$fuzz" --forward --no-backup-if-mismatch \
                  --dry-run --silent <"${OLDPWD}/${patch}" >/dev/null 2>&1 ); then
                ( cd upstream && patch -p1 --fuzz="$fuzz" --forward --no-backup-if-mismatch \
                    --silent <"${OLDPWD}/${patch}" >/dev/null )
                loosened="$fuzz"
                break
              fi
            done
            if (( loosened > 0 )); then
              echo "::notice::${name} applied with fuzz ${loosened}"
              continue
            fi
            candidate="$RUNNER_TEMP/repaired/${name}"
            if python3 scripts/repair-patch-anchors.py \
                --patch "$patch" --source upstream --output "$candidate" \
                --report "$RUNNER_TEMP/repaired/${name%.patch}.report" >/dev/null 2>&1 &&
                git -C upstream apply --check --whitespace=nowarn "$candidate" 2>/dev/null; then
              git -C upstream apply --whitespace=nowarn "$candidate"
              cp -- "$candidate" "$patch"
              repaired="${repaired} ${name%.patch}"
            else
              failed="${failed} ${name}"
            fi
          done
          if [[ -n "$failed" ]]; then
            printf '%s\n' "$failed" > "$RUNNER_TEMP/failed.txt"
            echo "ok=0" >> "$GITHUB_OUTPUT"
            echo "reason=patches" >> "$GITHUB_OUTPUT"
            echo "::warning::Patches that do not apply on ${{ steps.upstream.outputs.ref }}:${failed}"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
            echo "repaired=${repaired# }" >> "$GITHUB_OUTPUT"
            if [[ -n "$repaired" ]]; then
              echo "::notice::Re-anchored patches:${repaired}"
            else
              echo "All patches apply on ${{ steps.upstream.outputs.ref }}."
            fi
          fi

      # `main` is the ref a builder falls back to whenever the per-release branch
      # is missing, and the manifest on it is what tells the builder whether the
      # patch set matches the requested commit. It used to be created once and
      # never advanced, so every release after the first left `main` pinned to a
      # stale base: the fallback then loaded the previous patch set and
      # scripts/apply.sh rejected the build. Publishing both refs in one step
      # keeps them from disagreeing.
      - name: Publish the release branch and the default branch
        if: steps.trial.outputs.ok == '1'
        env:
          REF: ${{ steps.upstream.outputs.ref }}
          COMMIT: ${{ steps.upstream.outputs.commit }}
          REPAIRED: ${{ steps.trial.outputs.repaired }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # The working tree already carries the re-anchored patches, so both refs
          # are built from the same content. scripts/write-manifest.py recomputes
          # patch_count from the files that are actually there.
          python3 scripts/write-manifest.py --ref "$REF" --commit "$COMMIT" --patches patches
          git add manifest.json patches

          committed=0
          if ! git diff --cached --quiet; then
            git checkout -B "$REF"
            if [[ -n "$REPAIRED" ]]; then
              git commit -m "Follow ${REF}: ${COMMIT}" -m "Re-anchored patches: ${REPAIRED}"
            else
              git commit -m "Follow ${REF}: ${COMMIT}"
            fi
            committed=1
          else
            echo "::notice::manifest.json already targets ${COMMIT}; reusing the existing tree."
            git checkout -B "$REF"
          fi
          git push --force-with-lease origin "refs/heads/${REF}"

          # Point the fallback ref at the same commit. A force is required because
          # the default branch cannot fast-forward onto a re-based release branch,
          # and this workflow owns both refs.
          #
          # The default branch must NOT be a release ref. It is force-pushed on
          # every release, so a default named after a version would be rewritten
          # to carry a different release's patches while keeping the old name --
          # and anyone who pinned `upstream_ref: v25.12.6` would silently receive
          # the newer series. Refuse, and say how to fix it.
          fallback_note=""
          if [[ "$DEFAULT_BRANCH" =~ ^v[0-9] ]]; then
            echo "::warning title=Unsafe default branch::${DEFAULT_BRANCH} is named after a release, so it is not refreshed. Set the repository default branch to \`main\` (Settings -> Branches); a pinned \`${DEFAULT_BRANCH}\` must keep its own release content."
            fallback_note="\`${DEFAULT_BRANCH}\` is named after a release and was left alone; rename the default branch to \`main\` so the fallback path can follow releases."
          else
            if [[ "$(git ls-remote --heads origin "refs/heads/${DEFAULT_BRANCH}" | cut -f1)" \
                  != "$(git rev-parse HEAD)" ]]; then
              git push --force origin "HEAD:refs/heads/${DEFAULT_BRANCH}"
            fi
            fallback_note="\`${DEFAULT_BRANCH}\` points at the same commit, so the fallback path matches it too."
          fi

          {
            echo "Published \`${REF}\` for ${COMMIT} (${committed} new commit(s))."
            echo
            echo "The builder picks it up automatically: \`upstream_ref: ${REF}\` now resolves to this branch."
            echo "${fallback_note}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open a review pull request for the re-anchored patches
        if: steps.trial.outputs.ok == '1' && steps.trial.outputs.repaired != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ steps.upstream.outputs.ref }}
          REPAIRED: ${{ steps.trial.outputs.repaired }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/review.md"
          {
            echo "## ${REF} needed re-anchored patches"
            echo
            echo "The scheduled follow-up published \`${REF}\`, but these patches did not apply as written."
            echo "Their hunk context was re-read from the new upstream tree; added and removed lines are untouched."
            echo
            for name in $REPAIRED; do
              echo "### \`${name}\`"
              echo
              echo '```'
              cat "$RUNNER_TEMP/repaired/${name}.report" 2>/dev/null || echo "(no notes)"
              echo '```'
              echo
            done
            echo "Review the patch diff above before relying on the branch. Closing this pull request does not delete the branch."
          } > "$body"
          if gh pr list --repo "$GITHUB_REPOSITORY" --head "$REF" --state open --json number --jq '.[0].number' | grep -q .; then
            echo "A review pull request for ${REF} is already open."
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --head "$REF" --base "$BASE_BRANCH" \
              --title "Review the re-anchored patch set for ${REF}" --body-file "$body" \
              || echo "::warning::Could not open the pull request for ${REF}."
          fi

      - name: Report a release the patch set cannot follow yet
        if: steps.state.outputs.follows != '1' && steps.trial.outputs.ok == '0'
        env:
          REF: ${{ steps.upstream.outputs.ref }}
          COMMIT: ${{ steps.upstream.outputs.commit }}
          REASON: ${{ steps.trial.outputs.reason }}
        run: |
          set -euo pipefail
          {
            echo "## The patch set cannot follow ${REF} yet"
            echo
            echo "Upstream \`${REF}\` (${COMMIT}) was published, but the patches on \`main\` do not apply to it."
            echo
            if [[ "$REASON" == "patches" ]]; then
              echo "Patches that failed:"
              echo
              echo '```'
              cat "$RUNNER_TEMP/failed.txt"
              echo '```'
            else
              echo "Running \`scripts/prepare-source.sh\` on the new release failed before any patch was tried."
            fi
            echo
            echo "Fix the anchors, then re-run this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
